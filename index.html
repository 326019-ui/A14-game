<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>純喫茶タイピング</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- レトロな雰囲気を出す明朝体フォント -->
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --color-bg: #2c1a0f;
            --color-board: #1a0f08;
            --color-text: #f4e8d4;
            --color-accent: #c24d2c;
            --color-typed: #d99a5a;
            --color-border: #8c6a4b;
        }

        body {
            background-color: var(--color-bg);
            color: var(--color-text);
            font-family: 'Shippori Mincho B1', serif;
            overflow: hidden;
            /* レトロな壁紙風のテクスチャ */
            background-image: 
                radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.4) 100%),
                repeating-linear-gradient(45deg, rgba(140, 106, 75, 0.05) 0px, rgba(140, 106, 75, 0.05) 2px, transparent 2px, transparent 4px);
        }

        /* 喫茶店のメニューボード風コンテナ */
        .menu-board {
            background-color: rgba(26, 15, 8, 0.85);
            border: 6px double var(--color-border);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(0,0,0,0.9);
            backdrop-filter: blur(5px);
        }

        /* ネオンサイン風の光 */
        .glow-text {
            text-shadow: 0 0 10px rgba(244, 232, 212, 0.3), 0 0 20px rgba(244, 232, 212, 0.2);
        }

        .typed {
            color: var(--color-typed);
            text-shadow: 0 0 8px rgba(217, 154, 90, 0.6);
        }

        .untyped {
            color: rgba(244, 232, 212, 0.4);
        }

        /* ボタンのレトロスタイル */
        .retro-btn {
            background: transparent;
            border: 2px solid var(--color-border);
            color: var(--color-text);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .retro-btn:hover {
            background: var(--color-border);
            color: var(--color-board);
            box-shadow: 0 0 15px rgba(140, 106, 75, 0.6);
        }

        /* アニメーション */
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fade-in {
            animation: fade-in 0.5s ease-out forwards;
        }

        /* ミス時の画面揺れ */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }
        .error-shake {
            animation: shake 0.3s ease-in-out;
            color: var(--color-accent) !important;
        }

        .screen {
            display: none;
        }
        .screen.active {
            display: flex;
        }

        /* レトロな装飾ライン */
        .hr-retro {
            border: 0;
            height: 1px;
            background-image: linear-gradient(to right, transparent, var(--color-border), transparent);
            margin: 1.5rem 0;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center p-4">

    <!-- 珈琲豆のSVG装飾 (背景) -->
    <svg class="absolute top-10 left-10 w-24 h-24 opacity-10" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12,2C6.48,2 2,6.48 2,12C2,17.52 6.48,22 12,22C17.52,22 22,17.52 22,12C22,6.48 17.52,2 12,2M11.5,19.93C7.06,19.43 3.5,15.7 3.5,11.5C3.5,11.39 3.5,11.27 3.53,11.16C4.85,12.18 6.45,12.78 8.13,12.92C9.8,13.06 11.45,12.72 12.87,11.96C13.82,11.45 14.65,10.74 15.3,9.88C15.96,9.03 16.42,8.04 16.66,7C17.2,7 17.76,7.05 18.29,7.16C19.34,8.4 20,10.05 20,11.83C20,16.27 16.43,19.93 12,19.93H11.5M12,4A8,8 0 0,1 19.35,8.85C18.66,8.68 17.95,8.61 17.23,8.61C16.89,8.61 16.55,8.63 16.21,8.68C15.82,10.06 15.11,11.31 14.12,12.31C12.76,13.67 10.96,14.54 9,14.8C7.04,15.06 5,14.67 3.32,13.7C4.15,8.25 8.91,4 14.5,4H12Z" />
    </svg>

    <div class="menu-board w-full max-w-3xl rounded-lg flex flex-col p-8 md:p-12 relative z-10 animate-fade-in">
        
        <!-- ================= START SCREEN ================= -->
        <div id="start-screen" class="screen active flex-col items-center justify-center text-center">
            <p class="text-sm md:text-base tracking-[0.3em] mb-2 text-[#8c6a4b]">純喫茶の香りとともに</p>
            <h1 class="text-4xl md:text-6xl font-bold mb-6 glow-text tracking-widest">珈琲打鍵</h1>
            <hr class="hr-retro w-3/4 mx-auto">
            <p class="mb-10 text-lg leading-relaxed text-gray-300">
                喫茶店のメニューをタイピングしてください。<br>
                制限時間は <span class="text-[var(--color-typed)]">60秒</span> です。<br>
                半角英数で入力を行ってください。
            </p>
            <button onclick="startGame()" class="retro-btn px-10 py-3 text-xl rounded shadow-lg tracking-widest font-semibold">
                入店する (START)
            </button>
        </div>

        <!-- ================= GAME SCREEN ================= -->
        <div id="game-screen" class="screen flex-col items-center w-full">
            <div class="flex justify-between w-full mb-8 text-xl font-bold border-b border-[#8c6a4b] pb-4">
                <div>伝票番号: <span id="score-display" class="text-[var(--color-typed)]">0</span></div>
                <div>残り時間: <span id="time-display" class="text-[var(--color-typed)]">60</span>秒</div>
            </div>

            <div class="flex-grow flex flex-col items-center justify-center w-full py-10">
                <!-- 日本語の問題 -->
                <div id="japanese-text" class="text-3xl md:text-5xl font-bold mb-6 tracking-wider glow-text"></div>
                <!-- ローマ字のタイピングエリア -->
                <div id="romaji-text" class="text-2xl md:text-4xl font-mono tracking-widest">
                    <span id="typed-part" class="typed"></span><span id="untyped-part" class="untyped"></span>
                </div>
                
                <div id="combo-display" class="mt-8 text-lg text-[#8c6a4b] transition-opacity opacity-0">
                    Combo x<span id="combo-count">0</span>
                </div>
            </div>
            
            <div class="mt-4 text-sm text-gray-500 tracking-wider">
                キーボードで入力してください
            </div>
        </div>

        <!-- ================= RESULT SCREEN ================= -->
        <div id="result-screen" class="screen flex-col items-center justify-center text-center">
            <h2 class="text-3xl md:text-5xl font-bold mb-4 tracking-widest glow-text">お会計</h2>
            <hr class="hr-retro w-3/4 mx-auto">
            
            <div class="text-xl md:text-2xl space-y-4 my-8 text-left inline-block border-2 border-dashed border-[#8c6a4b] p-8 bg-[rgba(0,0,0,0.3)]">
                <p class="flex justify-between gap-12"><span>タイプ数:</span> <span id="result-keys">0</span></p>
                <p class="flex justify-between gap-12"><span>ミス回数:</span> <span id="result-miss">0</span></p>
                <p class="flex justify-between gap-12"><span>最大コンボ:</span> <span id="result-combo">0</span></p>
                <hr class="border-[#8c6a4b] my-4 border-dashed">
                <p class="flex justify-between gap-12 text-3xl font-bold text-[var(--color-typed)]">
                    <span>総合得点:</span> <span id="result-score">0</span>
                </p>
            </div>

            <p id="evaluation-text" class="text-xl mb-10 text-[var(--color-typed)]"></p>

            <button onclick="resetGame()" class="retro-btn px-8 py-3 text-lg rounded shadow-lg tracking-widest">
                再来店する (RETRY)
            </button>
        </div>

    </div>

    <script>
        // === 喫茶店メニューのワードリスト ===
        const words = [
            { jp: "コーヒー", romaji: "ko-hi-" },
            { jp: "クリームソーダ", romaji: "kuri-muso-da" },
            { jp: "ナポリタン", romaji: "naporitan" },
            { jp: "オムライス", romaji: "omuraisu" },
            { jp: "ホットケーキ", romaji: "hottoke-ki" },
            { jp: "プリンアラモード", romaji: "purinaramo-do" },
            { jp: "ミックスサンド", romaji: "mikkususando" },
            { jp: "サイフォン", romaji: "saifon" },
            { jp: "マスター", romaji: "masuta-" },
            { jp: "おしぼり", romaji: "oshibori" },
            { jp: "モーニングセット", romaji: "mo-ningsetto" },
            { jp: "ウインナーコーヒー", romaji: "uinna-ko-hi-" },
            { jp: "レモンスカッシュ", romaji: "remonsukasshu" },
            { jp: "フルーツパフェ", romaji: "furu-tsupafe" },
            { jp: "たまごサンド", romaji: "tamagosando" },
            { jp: "アイスティー", romaji: "aisuti-" },
            { jp: "純喫茶", romaji: "junkissa" },
            { jp: "ブレンド", romaji: "burendo" },
            { jp: "ミルクセーキ", romaji: "mirukuse-ki" },
            { jp: "ピラフ", romaji: "pirafu" }
        ];

        // === ゲーム状態 ===
        let currentWord = {};
        let typedString = "";
        let untypedString = "";
        let score = 0;
        let timeLeft = 60;
        let timerInterval = null;
        let isPlaying = false;
        
        let stats = {
            keys: 0,
            miss: 0,
            combo: 0,
            maxCombo: 0
        };

        // === DOM要素 ===
        const screens = {
            start: document.getElementById('start-screen'),
            game: document.getElementById('game-screen'),
            result: document.getElementById('result-screen')
        };
        const elTime = document.getElementById('time-display');
        const elScore = document.getElementById('score-display');
        const elJp = document.getElementById('japanese-text');
        const elTyped = document.getElementById('typed-part');
        const elUntyped = document.getElementById('untyped-part');
        const elCombo = document.getElementById('combo-display');
        const elComboCount = document.getElementById('combo-count');

        // === サウンド (Web Audio API) ===
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        // タイプ音（カタカタ音）
        function playTypeSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();

            osc.type = 'square';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.03);

            filter.type = 'lowpass';
            filter.frequency.value = 1000;

            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.03);

            osc.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.03);
        }

        // ミス音
        function playMissSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(80, audioCtx.currentTime + 0.1);
            
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        // 正解音（チーン）
        function playCompleteSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, audioCtx.currentTime); // A5
            osc.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.5);
            
            gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        }

        // === ゲームロジック ===
        function switchScreen(screenName) {
            Object.values(screens).forEach(s => s.classList.remove('active'));
            screens[screenName].classList.add('active');
        }

        function getNextWord() {
            const idx = Math.floor(Math.random() * words.length);
            currentWord = words[idx];
            typedString = "";
            untypedString = currentWord.romaji;
            updateDisplay();
        }

        function updateDisplay() {
            elJp.textContent = currentWord.jp;
            elTyped.textContent = typedString;
            elUntyped.textContent = untypedString;
            elScore.textContent = score;
            
            if (stats.combo > 4) {
                elComboCount.textContent = stats.combo;
                elCombo.style.opacity = 1;
            } else {
                elCombo.style.opacity = 0;
            }
        }

        function startGame() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            score = 0;
            timeLeft = 60;
            stats = { keys: 0, miss: 0, combo: 0, maxCombo: 0 };
            
            elTime.textContent = timeLeft;
            switchScreen('game');
            getNextWord();
            isPlaying = true;
            
            timerInterval = setInterval(() => {
                timeLeft--;
                elTime.textContent = timeLeft;
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        function endGame() {
            isPlaying = false;
            clearInterval(timerInterval);
            
            // スコア計算 (基本点 + コンボボーナス - ミス減点)
            let finalScore = score + (stats.maxCombo * 10) - (stats.miss * 5);
            if (finalScore < 0) finalScore = 0;

            document.getElementById('result-keys').textContent = stats.keys;
            document.getElementById('result-miss').textContent = stats.miss;
            document.getElementById('result-combo').textContent = stats.maxCombo;
            document.getElementById('result-score').textContent = finalScore;

            let evalText = "";
            if (finalScore > 2000) evalText = "常連客の鑑。マスターも喜んでいます。";
            else if (finalScore > 1000) evalText = "なかなかのタイピング。美味しい珈琲はいかがですか？";
            else if (finalScore > 500) evalText = "ゆっくりくつろいでいってくださいね。";
            else evalText = "焦らず、まずは珈琲でも飲んで落ち着きましょう。";

            document.getElementById('evaluation-text').textContent = evalText;

            switchScreen('result');
        }

        function resetGame() {
            switchScreen('start');
        }

        // キー入力イベント
        document.addEventListener('keydown', (e) => {
            if (!isPlaying) return;
            
            // 無視するキー
            if (['Shift', 'Control', 'Alt', 'Meta', 'Tab', 'Enter', 'Backspace'].includes(e.key)) return;

            const typedKey = e.key.toLowerCase();
            const expectedKey = untypedString.charAt(0).toLowerCase();

            if (typedKey === expectedKey) {
                // 正解
                playTypeSound();
                typedString += untypedString.charAt(0);
                untypedString = untypedString.substring(1);
                
                stats.keys++;
                stats.combo++;
                if (stats.combo > stats.maxCombo) stats.maxCombo = stats.combo;
                
                // 1文字10点 + コンボボーナス
                score += 10 + Math.floor(stats.combo / 5) * 5; 
                
                if (untypedString === "") {
                    // 単語完了
                    playCompleteSound();
                    score += 50; // 単語完了ボーナス
                    getNextWord();
                } else {
                    updateDisplay();
                }
            } else {
                // 不正解
                playMissSound();
                stats.miss++;
                stats.combo = 0;
                
                // エラーアニメーション
                const romajiContainer = document.getElementById('romaji-text');
                romajiContainer.classList.remove('error-shake');
                void romajiContainer.offsetWidth; // リフロー強制
                romajiContainer.classList.add('error-shake');
                
                updateDisplay();
            }
        });
    </script>
</body>
</html>
